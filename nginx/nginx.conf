# Main config. Per-site config lives in sites/*.conf.template, which the image
# renders into /etc/nginx/conf.d/ at startup with the values from .env.
#
# No "user" directive: the container already runs as uid 101. pid and temp
# paths sit under /tmp because the root filesystem is mounted read-only.

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    log_format proxy '$remote_addr [$time_local] $server_port "$host" "$request" '
                     '$status $body_bytes_sent ${request_time}s '
                     'upstream=$upstream_addr/$upstream_status "$http_user_agent"';
    access_log /dev/stdout proxy;

    sendfile         on;
    tcp_nopush       on;
    keepalive_timeout 65s;
    server_tokens    off;

    gzip            on;
    gzip_vary       on;
    gzip_proxied    any;
    gzip_min_length 1024;
    gzip_types      text/plain text/css text/javascript application/javascript
                    application/json application/xml image/svg+xml;

    # Docker's embedded DNS. Upstreams are looked up per request (see the
    # "set $upstream" lines in each site), not once at startup. Without that,
    # one project being down keeps nginx from starting and takes every other
    # project's front door down with it.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    # TLS settings shared by every site. Certificates are per site; see
    # docker-entrypoint.d/40-local-ca.sh.
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;

    # WebSocket upgrade, for any future service that needs it.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      '';
    }

    # Security headers, set only when the app did not set its own. Every
    # current project sets these itself, and some set them stricter than a
    # one-size default (plumb sends Referrer-Policy: no-referrer). The proxy
    # fills a gap; it does not overrule the app. An empty value means
    # add_header sends nothing.
    map $upstream_http_x_content_type_options $hdr_nosniff {
        ''      'nosniff';
        default '';
    }
    map $upstream_http_x_frame_options $hdr_xfo {
        ''      'DENY';
        default '';
    }
    map $upstream_http_referrer_policy $hdr_referrer {
        ''      'same-origin';
        default '';
    }
    map $upstream_http_strict_transport_security $hdr_hsts {
        ''      'max-age=31536000';
        default '';
    }

    # Local health endpoint for the compose healthcheck. Loopback only.
    server {
        listen 127.0.0.1:8081;
        access_log off;
        location = /healthz { return 200 "ok\n"; }
        location /          { return 404; }
    }

    include /etc/nginx/conf.d/*.conf;
}
