# Included inside each site's "location /" block, after proxy_pass.

proxy_http_version 1.1;

# The apps run werkzeug ProxyFix with x_for=1, x_proto=1, x_host=1: they trust
# exactly one proxy and read the right-most value of each header.
#
# X-Forwarded-For is overwritten with the connecting address, not appended to.
# Caddy did the same, and CAIRN's auth audit trail depends on it (see
# cairn/app/routes/auth.py, _client_ip). Appending would still put the real
# address right-most, but overwriting means nothing a client sends survives.
proxy_set_header Host              $http_host;
proxy_set_header X-Forwarded-For   $remote_addr;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $http_host;
proxy_set_header X-Forwarded-Port  $server_port;
proxy_set_header Forwarded         "";

proxy_set_header Upgrade    $http_upgrade;
proxy_set_header Connection $connection_upgrade;

# Stream request bodies straight to the app instead of spooling them to disk
# first. This is what Caddy did, and it keeps a 512 MB CAIRN restore from
# landing in the container's /tmp, which is a small in-memory tmpfs.
proxy_request_buffering off;

proxy_connect_timeout 10s;

add_header X-Content-Type-Options $hdr_nosniff  always;
add_header X-Frame-Options        $hdr_xfo      always;
add_header Referrer-Policy        $hdr_referrer always;
add_header Strict-Transport-Security $hdr_hsts  always;
